services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      DATABASE_URL: "blog:blog_password@tcp(mysql:3306)/blog?parseTime=true&loc=UTC"
      ADMIN_API_KEY: change-me
      PUBLIC_BASE_URL: http://localhost:8080
      S3_ENDPOINT: http://seaweed:8333
      S3_REGION: us-east-1
      S3_BUCKET: blog
      S3_ACCESS_KEY_ID: admin
      S3_SECRET_ACCESS_KEY: admin
      S3_USE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:8333/blog
      NEXT_REVALIDATE_URL: http://host.docker.internal:3000/api/revalidate
      NEXT_REVALIDATE_SECRET: change-me-too
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - seaweed

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog
      MYSQL_PASSWORD: blog_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../migrations:/docker-entrypoint-initdb.d:ro

  seaweed:
    image: chrislusf/seaweedfs:latest
    command:
      - server
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -dir=/data
      - -volume.max=5
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweed-data:/data
      - ./seaweed-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  mysql-data:
  seaweed-data:
